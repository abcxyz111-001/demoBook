<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thư Viện Sách Của Tôi</title>
    
    <!-- Sử dụng Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font chữ Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icon từ Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #fafafa; /* Nền trắng đục ấm hơn một chút (Neutral 50) */
            color: #171717;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animation xuất hiện */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-entry {
            animation: fadeUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        /* Hiệu ứng bìa sách hiện đại */
        .book-cover-container {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* Hover effect cho PC */
        @media (hover: hover) {
            .book-item:hover .book-cover-container {
                transform: translateY(-8px) scale(1.02);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
            .book-item:hover .read-icon {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Active effect cho Mobile */
        .book-item:active .book-cover-container {
            transform: scale(0.96);
        }

        /* Custom Scrollbar ẩn cho trải nghiệm giống App */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4d4d4; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-slate-900 selection:text-white">

    <!-- PHẦN 1: HEADER (MINIMALIST) -->
    <!-- Đã bỏ phần Account, chỉ giữ lại bố cục thoáng -->
    <header class="sticky top-0 z-50 bg-[#fafafa]/80 backdrop-blur-xl border-b border-neutral-100">
        <div class="max-w-7xl mx-auto px-5 sm:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex items-center gap-3 cursor-pointer select-none group">
                    <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white shadow-lg shadow-slate-900/20 group-hover:scale-105 transition-transform">
                        <i data-lucide="library" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <span class="block font-bold text-xl tracking-tight text-slate-900 leading-none">Bookshelf.</span>
                        <span class="text-[10px] font-medium text-slate-500 uppercase tracking-widest">Personal Library</span>
                    </div>
                </div>
                
                <!-- Search Button (Chỉ giữ nút này) -->
                <button class="p-3 rounded-full hover:bg-neutral-100 active:bg-neutral-200 text-slate-600 transition-colors touch-manipulation group">
                    <i data-lucide="search" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- PHẦN 2: NỘI DUNG CHÍNH -->
    <main class="flex-grow max-w-7xl mx-auto px-5 sm:px-8 py-8 w-full">
        
        <!-- Section Header -->
        <div class="flex items-end justify-between mb-10 animate-entry" style="animation-delay: 0.05s;">
            <div>
                <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 mb-2 tracking-tight">Đang Đọc</h1>
                <p class="text-slate-500 font-medium">Khám phá bộ sưu tập của bạn</p>
            </div>
            <!-- Filter giả lập -->
            <div class="hidden sm:flex gap-2">
                <span class="px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded-full cursor-pointer">Tất cả</span>
                <span class="px-4 py-2 text-slate-500 hover:bg-neutral-100 text-sm font-medium rounded-full cursor-pointer transition">Yêu thích</span>
            </div>
        </div>

        <!-- GRID SÁCH (STYLE MỚI) -->
        <div id="book-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-x-6 gap-y-10 pb-20">
            <!-- JS Render -->
        </div>

    </main>

    <!-- PHẦN 3: MODAL (POPUP HIỆN ĐẠI) -->
    <div id="book-modal" class="relative z-[100] hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-md transition-opacity opacity-0 ease-out duration-300" id="modal-backdrop"></div>

        <!-- Wrapper -->
        <div id="modal-wrapper" class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
                
                <!-- Panel -->
                <div class="relative transform overflow-hidden rounded-3xl bg-white text-left shadow-2xl transition-all sm:my-8 w-full max-w-2xl opacity-0 scale-95 duration-300 ease-out" id="modal-panel">
                    
                    <div class="flex flex-col sm:flex-row">
                        <!-- Cột Ảnh (Bên trái hoặc trên cùng) -->
                        <div class="bg-neutral-50 p-8 sm:w-2/5 flex items-center justify-center border-b sm:border-b-0 sm:border-r border-neutral-100">
                            <div class="relative w-32 sm:w-40 shadow-2xl rounded-lg rotate-3 transition-transform hover:rotate-0 duration-500">
                                <img id="modal-img" src="" alt="Cover" class="w-full h-auto rounded-lg object-cover">
                            </div>
                        </div>

                        <!-- Cột Thông tin (Bên phải hoặc dưới) -->
                        <div class="p-8 sm:w-3/5 flex flex-col justify-center">
                            <div class="mb-auto">
                                <span class="inline-block px-3 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-bold uppercase tracking-wider mb-3" id="modal-category">Category</span>
                                <h3 class="text-2xl font-bold text-slate-900 mb-1 leading-tight" id="modal-title">Title</h3>
                                <p class="text-lg text-slate-500 font-medium mb-4" id="modal-author">Author</p>
                                
                                <div class="flex items-center gap-4 mb-6 text-sm text-slate-400 font-medium">
                                    <span class="flex items-center gap-1 text-amber-500"><i data-lucide="star" class="w-4 h-4 fill-current"></i> 4.8</span>
                                    <span>•</span>
                                    <span>250 trang</span>
                                    <span>•</span>
                                    <span>2024</span>
                                </div>

                                <p class="text-slate-600 leading-relaxed text-sm mb-6 line-clamp-4" id="modal-desc">
                                    Description...
                                </p>
                            </div>

                            <div class="flex gap-3 mt-4 sm:mt-0">
                                <button class="btn-read flex-1 bg-slate-900 text-white px-6 py-3.5 rounded-xl font-semibold hover:bg-slate-800 transition-colors shadow-lg shadow-slate-900/20">
                                    Đọc Ngay
                                </button>
                                <button onclick="closeModal()" class="px-6 py-3.5 rounded-xl border border-slate-200 font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
                                    Đóng
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- PHẦN 4: JAVASCRIPT -->
    <script>
        lucide.createIcons();

        // DỮ LIỆU SÁCH (Giữ nguyên)
        const books = [
            {
                id: 1,
                title: "Nhà Giả Kim",
                author: "Paulo Coelho",
                category: "Tiểu thuyết",
                desc: "Hành trình theo đuổi vận mệnh của chàng chăn cừu Santiago. Một cuốn sách kinh điển về ước mơ và sự can đảm để lắng nghe trái tim mình.",
                cover: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400" 
            },
            {
                id: 2,
                title: "Đắc Nhân Tâm",
                author: "Dale Carnegie",
                category: "Kỹ năng sống",
                desc: "Nghệ thuật thu phục lòng người. Cuốn sách gối đầu giường của nhiều thế hệ về giao tiếp, ứng xử và thành công trong cuộc sống.",
                cover: "https://images.unsplash.com/photo-1589829085413-56de8ae18c73?auto=format&fit=crop&q=80&w=400"
            },
            {
                id: 3,
                title: "Clean Code",
                author: "Robert C. Martin",
                category: "Lập trình",
                desc: "Hướng dẫn viết mã sạch, dễ đọc và dễ bảo trì. Cuốn sách phải đọc cho mọi lập trình viên muốn nâng cao tay nghề.",
                cover: "https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&q=80&w=400"
            },
            {
                id: 4,
                title: "Sapiens",
                author: "Yuval Noah Harari",
                category: "Lịch sử",
                desc: "Lược sử loài người từ thời kỳ đồ đá đến kỷ nguyên công nghệ sinh học. Một cái nhìn toàn diện và sâu sắc về lịch sử nhân loại.",
                cover: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=400"
            },
            {
                id: 5,
                title: "Tuổi Trẻ Đáng Giá Bao Nhiêu",
                author: "Rosie Nguyễn",
                category: "Self-help",
                desc: "Cuốn sách dành cho người trẻ đang loay hoay tìm hướng đi cho cuộc đời. Những bài học quý giá về việc tự học và trải nghiệm.",
                cover: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=400"
            },
             {
                id: 6,
                title: "Harry Potter",
                author: "J.K. Rowling",
                category: "Giả tưởng",
                desc: "Cậu bé phù thủy và chuyến phiêu lưu tại trường Hogwarts. Một thế giới phép thuật đầy màu sắc và những bài học về tình bạn.",
                cover: "https://images.unsplash.com/photo-1618666012174-83b441c0bc76?auto=format&fit=crop&q=80&w=400"
            }
        ];

        const gridElement = document.getElementById('book-grid');

        function renderBooks() {
            gridElement.innerHTML = ''; 

            books.forEach((book, index) => {
                const card = document.createElement('div');
                // Style mới: Không dùng border/bg-white container, tập trung vào ảnh
                card.className = "book-item group cursor-pointer animate-entry flex flex-col touch-manipulation select-none";
                card.style.animationDelay = `${index * 0.08}s`;
                
                card.onclick = () => openModal(book);

                card.innerHTML = `
                    <div class="relative w-full aspect-[2/3] mb-4">
                        <!-- Container ảnh với shadow đẹp -->
                        <div class="book-cover-container w-full h-full rounded-2xl overflow-hidden bg-neutral-200 relative z-10">
                            <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover">
                            
                            <!-- Lớp phủ gradient nhẹ khi hover -->
                            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors duration-300"></div>
                        </div>

                        <!-- Icon đọc sách hiện ra khi hover -->
                        <div class="read-icon absolute bottom-4 right-4 z-20 opacity-0 transform scale-75 transition-all duration-300 bg-white text-slate-900 p-2.5 rounded-full shadow-xl">
                            <i data-lucide="book-open" class="w-5 h-5"></i>
                        </div>
                    </div>
                    
                    <div class="px-1">
                        <h3 class="font-bold text-slate-900 text-base leading-tight mb-1 group-hover:text-indigo-600 transition-colors line-clamp-1">${book.title}</h3>
                        <p class="text-slate-500 text-sm font-medium line-clamp-1">${book.author}</p>
                        <div class="mt-2 flex items-center gap-1 text-xs font-semibold text-slate-400">
                            <span class="px-2 py-0.5 rounded bg-slate-100 uppercase tracking-wider text-[10px]">${book.category}</span>
                        </div>
                    </div>
                `;

                gridElement.appendChild(card);
            });
            
            lucide.createIcons();
        }

        // --- Modal Logic (Giữ nguyên logic, chỉ đổi layout HTML ở trên) ---
        const modal = document.getElementById('book-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalPanel = document.getElementById('modal-panel');
        const modalWrapper = document.getElementById('modal-wrapper');

        const mImg = document.getElementById('modal-img');
        const mTitle = document.getElementById('modal-title');
        const mAuthor = document.getElementById('modal-author');
        const mDesc = document.getElementById('modal-desc');
        const mCat = document.getElementById('modal-category');

        function openModal(book) {
            document.body.style.overflow = 'hidden';

            mImg.src = book.cover;
            mTitle.textContent = book.title;
            mAuthor.textContent = book.author;
            mDesc.textContent = book.desc;
            mCat.textContent = book.category;

            modal.classList.remove('hidden');
            
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    modalBackdrop.classList.remove('opacity-0');
                    modalPanel.classList.remove('opacity-0', 'scale-95');
                    modalPanel.classList.add('opacity-100', 'scale-100');
                });
            });
        }

        function closeModal() {
            modalBackdrop.classList.add('opacity-0');
            modalPanel.classList.remove('opacity-100', 'scale-100');
            modalPanel.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        modalWrapper.addEventListener('click', (e) => {
            if (e.target === modalWrapper || e.target.classList.contains('min-h-full')) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                closeModal();
            }
        });

        renderBooks();

    </script>
</body>
</html>
