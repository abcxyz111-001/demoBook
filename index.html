<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thư Viện Sách Hiện Đại</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f0f2f5;
            color: #1e293b;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- BACKGROUND ANIMATION --- */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                        radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                        radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-color: #f3f4f6;
            background-image: 
                radial-gradient(at 80% 0%, hsla(189,100%,90%,1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(341,100%,92%,1) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(263,100%,93%,1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22,100%,92%,1) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(240,100%,94%,1) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343,100%,94%,1) 0px, transparent 50%);
            filter: blur(40px);
            opacity: 0.8;
            animation: bg-pulse 15s ease-in-out infinite alternate;
        }

        @keyframes bg-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* --- GLASSMORPHISM --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* --- 3D TILT & ANIMATIONS --- */
        .book-card-container {
            transition: transform 0.3s ease;
            perspective: 1000px;
        }
        
        @media (hover: hover) {
            .book-card-container:hover { transform: translateY(-5px); }
            .book-card-inner { transition: transform 0.1s ease-out; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-entry {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        /* --- SIDEBAR TRANSITIONS --- */
        #fav-sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-open { transform: translateX(0) !important; }
        
        /* Custom scrollbar for sidebar */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <div class="bg-mesh"></div>

    <!-- HEADER -->
    <header class="sticky top-0 z-40 glass-panel border-b-0 shadow-sm supports-[backdrop-filter]:bg-white/60">
        <div class="max-w-7xl mx-auto px-5 sm:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-3 cursor-pointer select-none">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                        <i data-lucide="library" class="w-5 h-5"></i>
                    </div>
                    <span class="font-bold text-xl tracking-tight text-slate-800">MyLibrary.</span>
                </div>
                
                <div class="flex items-center gap-3">
                    <!-- Nút Mở Menu Yêu Thích -->
                    <button id="open-fav-btn" class="w-10 h-10 rounded-full bg-white/50 hover:bg-white flex items-center justify-center text-rose-500 transition shadow-sm border border-white/60 active:scale-95 group relative">
                        <i data-lucide="heart" class="w-5 h-5 group-hover:fill-rose-500 transition-colors"></i>
                        <!-- Badge số lượng -->
                        <span id="fav-count-badge" class="absolute -top-1 -right-1 w-5 h-5 bg-rose-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center shadow-sm scale-0 transition-transform">0</span>
                    </button>

                    <!-- Nút Tìm Kiếm -->
                    <button id="open-search-btn" class="w-10 h-10 rounded-full bg-white/50 hover:bg-white flex items-center justify-center text-slate-600 transition shadow-sm border border-white/60 active:scale-95">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-5 sm:px-8 py-8 w-full pb-20">
        
        <!-- SECTION TỦ SÁCH (Đã bỏ phần Sách Yêu Thích ngang, chuyển hết vào Menu) -->
        <section class="animate-entry" style="animation-delay: 0.1s;">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Tủ Sách Của Bạn</h2>
                <span class="text-sm font-medium text-slate-500 bg-white/50 px-3 py-1 rounded-full border border-white/60" id="total-books">0 cuốn</span>
            </div>

            <div id="book-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                <!-- JS Render sách -->
            </div>
        </section>

    </main>

    <!-- SEARCH OVERLAY -->
    <div id="search-overlay" class="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-md hidden transition-opacity opacity-0 duration-300">
        <div class="max-w-3xl mx-auto pt-20 px-6 w-full">
            <div class="relative transform transition-all duration-300 translate-y-[-20px]" id="search-box-container">
                <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 w-6 h-6"></i>
                <input id="search-input" type="text" placeholder="Tìm tên sách, tác giả..." autocomplete="off"
                    class="w-full bg-white/90 backdrop-blur-xl border-0 rounded-2xl py-4 pl-14 pr-14 text-lg shadow-2xl focus:ring-4 focus:ring-indigo-500/30 outline-none placeholder:text-slate-400 text-slate-800">
                <button id="close-search-btn" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 hover:bg-slate-200/50 rounded-full transition text-slate-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div id="search-results-area" class="mt-6 opacity-0 transition-opacity duration-500">
                <div id="search-results" class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[60vh] overflow-y-auto pr-2 custom-scroll"></div>
            </div>
        </div>
    </div>

    <!-- FAVORITES SIDEBAR (MENU YÊU THÍCH BÊN PHẢI) -->
    <!-- Backdrop cho Sidebar -->
    <div id="fav-backdrop" class="fixed inset-0 z-[70] bg-slate-900/20 backdrop-blur-sm hidden transition-opacity opacity-0 duration-300"></div>
    
    <!-- Sidebar Panel -->
    <div id="fav-sidebar" class="fixed inset-y-0 right-0 z-[80] w-full max-w-sm bg-white shadow-2xl transform translate-x-full flex flex-col">
        <!-- Sidebar Header -->
        <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-white/80 backdrop-blur-md z-10">
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="heart" class="w-5 h-5 fill-rose-500 text-rose-500"></i>
                Sách Yêu Thích
            </h2>
            <button id="close-fav-btn" class="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Sidebar Content (List) -->
        <div id="fav-list" class="flex-grow overflow-y-auto p-5 space-y-4 custom-scroll bg-slate-50">
            <!-- Nội dung sẽ được render bằng JS -->
            <div class="flex flex-col items-center justify-center h-full text-slate-400">
                <i data-lucide="book-heart" class="w-12 h-12 mb-3 opacity-50"></i>
                <p>Chưa có sách yêu thích</p>
            </div>
        </div>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-slate-100 bg-white text-center text-xs text-slate-400">
            Đã lưu <span id="fav-total-count" class="font-bold text-slate-700">0</span> cuốn sách
        </div>
    </div>


    <!-- MODAL (POPUP CHI TIẾT SÁCH) -->
    <div id="book-modal" class="relative z-[100] hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-md transition-opacity opacity-0" id="modal-backdrop"></div>

        <div id="modal-wrapper" class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
                
                <div class="relative transform overflow-hidden rounded-3xl bg-white/95 backdrop-blur-2xl text-left shadow-2xl transition-all sm:my-8 w-full max-w-lg opacity-0 scale-95 border border-white/50" id="modal-panel">
                    
                    <!-- Cover Header -->
                    <div class="relative h-64 bg-slate-100 flex items-center justify-center overflow-hidden">
                        <!-- Blur Background -->
                        <img id="modal-bg-blur" src="" class="absolute inset-0 w-full h-full object-cover opacity-40 blur-2xl scale-110">
                        
                        <!-- Main Cover -->
                        <div class="relative z-10 shadow-2xl rounded-lg rotate-3 transform translate-y-4 transition-transform hover:rotate-0 duration-500">
                             <img id="modal-img" src="" class="w-32 sm:w-36 rounded-lg object-cover border-4 border-white/20">
                        </div>
                        
                        <!-- Top Buttons -->
                        <div class="absolute top-4 left-4 right-4 flex justify-between z-20">
                             <!-- Nút Favorite (Trái Tim) -->
                             <button id="modal-fav-btn" class="w-10 h-10 rounded-full bg-white/30 backdrop-blur-md hover:bg-white text-white hover:text-rose-500 flex items-center justify-center transition-all shadow-lg border border-white/40 group active:scale-95">
                                <i data-lucide="heart" class="w-5 h-5 transition-transform group-hover:scale-110" id="modal-fav-icon"></i>
                            </button>

                            <!-- Close Button -->
                            <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-black/20 hover:bg-black/30 text-white flex items-center justify-center transition backdrop-blur-md border border-white/10">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="px-6 pt-8 pb-8 bg-white relative">
                        <!-- Category Badge -->
                        <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2">
                            <span id="modal-category" class="px-4 py-1.5 rounded-full bg-slate-900 text-white text-xs font-bold uppercase tracking-wider shadow-lg">Cat</span>
                        </div>

                        <div class="text-center mb-6">
                            <h3 class="text-2xl font-bold text-slate-900 leading-tight mb-2" id="modal-title">Book Title</h3>
                            <p class="text-indigo-600 font-semibold" id="modal-author">Author</p>
                        </div>

                        <p class="text-slate-600 text-sm leading-relaxed text-center mb-8 px-2" id="modal-desc">
                            Description...
                        </p>

                        <!-- Action Buttons -->
                        <div class="flex gap-3">
                            <a id="modal-link-btn" href="#" target="_blank" class="flex-1 btn-read bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-slate-900/20 transition-all flex items-center justify-center gap-2 group">
                                <span>Đọc Ngay</span>
                                <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        lucide.createIcons();

        // ==========================================
        // DỮ LIỆU SÁCH
        // ==========================================
        let books = [
            {
                id: 1,
                title: "Dạy Con Làm Giàu",
                author: "Kiyosaki",
                category: "Kinh Tế",
                desc: "Dạy con làm giàu.",
                cover: "https://cdn1.fahasa.com/media/catalog/product/d/a/day_con_lam_giau__tap_1_1_2018_08_03_15_23_14.jpg",
                isFavorite: true,
                link: "dayconlamgiau.html"
            },
            {
                id: 2,
                title: "Đắc Nhân Tâm",
                author: "Dale Carnegie",
                category: "Kỹ năng sống",
                desc: "Nghệ thuật thu phục lòng người. Quy tắc ứng xử để thành công trong giao tiếp và cuộc sống.",
                cover: "https://images.unsplash.com/photo-1589829085413-56de8ae18c73?auto=format&fit=crop&q=80&w=400",
                isFavorite: false,
                link: "https://google.com" 
            },
            {
                id: 3,
                title: "Clean Code",
                author: "Robert C. Martin",
                category: "Lập trình",
                desc: "Hướng dẫn viết mã sạch. Cuốn sách gối đầu giường cho mọi lập trình viên chuyên nghiệp.",
                cover: "https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&q=80&w=400",
                isFavorite: false,
                link: "#"
            },
            {
                id: 4,
                title: "Sapiens: Lược Sử",
                author: "Yuval Noah Harari",
                category: "Lịch sử",
                desc: "Lược sử loài người từ thời kỳ đồ đá đến kỷ nguyên công nghệ sinh học và trí tuệ nhân tạo.",
                cover: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=400",
                isFavorite: false,
                link: "#"
            },
            {
                id: 5,
                title: "Tuổi Trẻ Đáng Giá Bao Nhiêu",
                author: "Rosie Nguyễn",
                category: "Self-help",
                desc: "Cuốn sách dành cho người trẻ đang loay hoay tìm hướng đi, khuyến khích tự học và trải nghiệm.",
                cover: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=400",
                isFavorite: true,
                link: "#"
            },
             {
                id: 6,
                title: "Harry Potter",
                author: "J.K. Rowling",
                category: "Giả tưởng",
                desc: "Cậu bé phù thủy và chuyến phiêu lưu tại trường Hogwarts chống lại chúa tể hắc ám.",
                cover: "https://images.unsplash.com/photo-1618666012174-83b441c0bc76?auto=format&fit=crop&q=80&w=400",
                isFavorite: true,
                link: "#"
            },
            {
                id: 7,
                title: "Tư Duy Nhanh & Chậm",
                author: "Daniel Kahneman",
                category: "Tâm lý học",
                desc: "Phân tích hai hệ thống tư duy chi phối nhận thức và cách chúng ta đưa ra quyết định.",
                cover: "https://images.unsplash.com/photo-1555449373-4f952c427670?auto=format&fit=crop&q=80&w=400",
                isFavorite: false,
                link: "#"
            }
        ];

        // ==========================================
        // MAIN RENDER LOGIC
        // ==========================================
        document.getElementById('total-books').textContent = `${books.length} cuốn`;
        const gridElement = document.getElementById('book-grid');

        function renderGrid() {
            gridElement.innerHTML = '';
            books.forEach((book, index) => {
                const card = document.createElement('div');
                card.className = "book-card-container group cursor-pointer animate-entry flex flex-col";
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => openModal(book);

                // Tilt Effect
                card.onmousemove = (e) => {
                    if(window.innerWidth < 768) return;
                    const rect = card.getBoundingClientRect();
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((e.clientY - rect.top - centerY) / centerY) * -10; 
                    const rotateY = ((e.clientX - rect.left - centerX) / centerX) * 10;
                    const inner = card.querySelector('.book-card-inner');
                    if(inner) inner.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                };
                card.onmouseleave = () => {
                    const inner = card.querySelector('.book-card-inner');
                    if(inner) inner.style.transform = `perspective(1000px) rotateX(0) rotateY(0)`;
                };

                // Trái tim nhỏ trên thẻ sách (nếu là favorite)
                const favBadge = book.isFavorite 
                    ? `<div class="absolute top-2 right-2 bg-rose-500 text-white p-1 rounded-full shadow-md z-20"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="w-3 h-3"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>` 
                    : '';

                card.innerHTML = `
                    <div class="book-card-inner relative w-full aspect-[2/3] mb-4 rounded-2xl transition-all duration-200 ease-out">
                        <div class="w-full h-full rounded-2xl overflow-hidden bg-white shadow-md relative z-10 border border-white/60">
                            <img src="${book.cover}" class="w-full h-full object-cover">
                            ${favBadge}
                            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors duration-300 flex items-center justify-center">
                                 <div class="bg-white/90 backdrop-blur-sm p-2 rounded-full opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-300 shadow-lg">
                                    <i data-lucide="arrow-up-right" class="w-5 h-5 text-slate-900"></i>
                                </div>
                            </div>
                        </div>
                        <div class="absolute -bottom-2 inset-x-4 h-4 bg-slate-900/10 blur-md rounded-full z-0 group-hover:bg-slate-900/20 transition-colors"></div>
                    </div>
                    <div class="px-1 text-center sm:text-left">
                        <h3 class="font-bold text-slate-800 text-sm sm:text-base leading-tight mb-1 group-hover:text-indigo-600 transition-colors line-clamp-1">${book.title}</h3>
                        <p class="text-slate-500 text-xs sm:text-sm font-medium line-clamp-1">${book.author}</p>
                    </div>
                `;
                gridElement.appendChild(card);
            });
            lucide.createIcons();
        }
        renderGrid();

        // ==========================================
        // FAVORITES LOGIC (XỬ LÝ YÊU THÍCH)
        // ==========================================
        const favSidebar = document.getElementById('fav-sidebar');
        const favBackdrop = document.getElementById('fav-backdrop');
        const favList = document.getElementById('fav-list');
        const favTotalCount = document.getElementById('fav-total-count');
        const favCountBadge = document.getElementById('fav-count-badge');
        
        let currentOpenBookId = null; // Theo dõi sách nào đang mở trong modal

        // Toggle Favorite (Hàm quan trọng nhất)
        function toggleFavorite(bookId) {
            const book = books.find(b => b.id === bookId);
            if (!book) return;

            book.isFavorite = !book.isFavorite; // Đảo trạng thái
            
            // Render lại mọi thứ liên quan
            renderFavoritesSidebar();
            renderGrid(); // Update badge trên grid
            updateModalFavButtonState(book.isFavorite); // Update nút trong modal nếu đang mở
            updateFavBadge(); // Update số trên header
        }

        // Render Sidebar
        function renderFavoritesSidebar() {
            const favBooks = books.filter(b => b.isFavorite);
            favList.innerHTML = '';
            favTotalCount.textContent = favBooks.length;

            if (favBooks.length === 0) {
                favList.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-64 text-slate-400">
                        <i data-lucide="book-heart" class="w-12 h-12 mb-3 opacity-30"></i>
                        <p class="text-sm">Danh sách yêu thích trống</p>
                    </div>`;
            } else {
                favBooks.forEach(book => {
                    const el = document.createElement('div');
                    el.className = "flex gap-4 p-3 rounded-xl hover:bg-white hover:shadow-sm transition cursor-pointer border border-transparent hover:border-slate-100 group";
                    el.onclick = () => {
                        closeFavSidebar();
                        setTimeout(() => openModal(book), 300);
                    };
                    
                    el.innerHTML = `
                        <img src="${book.cover}" class="w-16 h-24 rounded-lg object-cover shadow-sm flex-shrink-0">
                        <div class="flex flex-col justify-center flex-grow min-w-0">
                            <h4 class="font-bold text-slate-800 text-sm mb-1 truncate">${book.title}</h4>
                            <p class="text-xs text-slate-500 mb-2 truncate">${book.author}</p>
                            
                            <!-- Nút xóa nhanh khỏi favorites -->
                            <button class="text-xs text-rose-500 font-medium flex items-center gap-1 hover:underline ml-auto" 
                                onclick="event.stopPropagation(); toggleFavorite(${book.id})">
                                <i data-lucide="trash-2" class="w-3 h-3"></i> Bỏ thích
                            </button>
                        </div>
                    `;
                    favList.appendChild(el);
                });
            }
            lucide.createIcons();
        }

        function updateFavBadge() {
            const count = books.filter(b => b.isFavorite).length;
            favCountBadge.textContent = count;
            if(count > 0) {
                favCountBadge.classList.remove('scale-0');
            } else {
                favCountBadge.classList.add('scale-0');
            }
        }

        // Sidebar Actions
        function openFavSidebar() {
            renderFavoritesSidebar(); // Đảm bảo dữ liệu mới nhất
            favBackdrop.classList.remove('hidden');
            // Timeout nhỏ để transition hoạt động
            setTimeout(() => {
                favBackdrop.classList.remove('opacity-0');
                favSidebar.classList.add('sidebar-open');
            }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeFavSidebar() {
            favSidebar.classList.remove('sidebar-open');
            favBackdrop.classList.add('opacity-0');
            setTimeout(() => {
                favBackdrop.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        document.getElementById('open-fav-btn').onclick = openFavSidebar;
        document.getElementById('close-fav-btn').onclick = closeFavSidebar;
        favBackdrop.onclick = closeFavSidebar;

        // Init
        updateFavBadge();

        // ==========================================
        // MODAL LOGIC
        // ==========================================
        const modal = document.getElementById('book-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalPanel = document.getElementById('modal-panel');
        const modalFavBtn = document.getElementById('modal-fav-btn');
        const modalFavIcon = document.getElementById('modal-fav-icon');
        
        // Cập nhật giao diện nút tim trong modal
        function updateModalFavButtonState(isFav) {
            if (isFav) {
                modalFavBtn.classList.remove('bg-white/30', 'text-white');
                modalFavBtn.classList.add('bg-rose-500', 'text-white', 'border-rose-400');
                modalFavIcon.setAttribute('fill', 'currentColor'); // Fill màu
            } else {
                modalFavBtn.classList.add('bg-white/30', 'text-white');
                modalFavBtn.classList.remove('bg-rose-500', 'border-rose-400');
                modalFavIcon.setAttribute('fill', 'none'); // Outline
            }
            lucide.createIcons();
        }

        // Xử lý click nút tim trong modal
        modalFavBtn.onclick = (e) => {
            e.stopPropagation();
            if (currentOpenBookId !== null) {
                toggleFavorite(currentOpenBookId);
                
                // Hiệu ứng nảy nút
                modalFavBtn.classList.add('scale-125');
                setTimeout(() => modalFavBtn.classList.remove('scale-125'), 200);
            }
        };

        function openModal(book) {
            currentOpenBookId = book.id;
            document.body.style.overflow = 'hidden';

            // Fill Data
            document.getElementById('modal-img').src = book.cover;
            document.getElementById('modal-bg-blur').src = book.cover;
            document.getElementById('modal-title').textContent = book.title;
            document.getElementById('modal-author').textContent = book.author;
            document.getElementById('modal-desc').textContent = book.desc;
            document.getElementById('modal-category').textContent = book.category;
            
            // Cập nhật trạng thái nút tim
            updateModalFavButtonState(book.isFavorite);

            // Link Logic
            const mLinkBtn = document.getElementById('modal-link-btn');
            if (book.link && book.link !== "#") {
                mLinkBtn.href = book.link;
                mLinkBtn.classList.remove('opacity-50', 'pointer-events-none');
                mLinkBtn.innerHTML = `<span>Đọc Ngay</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
            } else {
                mLinkBtn.href = "javascript:void(0)";
                mLinkBtn.classList.add('opacity-50', 'pointer-events-none');
                mLinkBtn.innerHTML = `<span>Chưa có link</span>`;
            }
            lucide.createIcons();

            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    modalBackdrop.classList.remove('opacity-0');
                    modalPanel.classList.remove('opacity-0', 'scale-95');
                    modalPanel.classList.add('opacity-100', 'scale-100');
                });
            });
        }

        function closeModal() {
            currentOpenBookId = null;
            modalBackdrop.classList.add('opacity-0');
            modalPanel.classList.remove('opacity-100', 'scale-100');
            modalPanel.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        document.getElementById('modal-wrapper').addEventListener('click', (e) => {
            if (e.target.id === 'modal-wrapper') closeModal();
        });

        // ==========================================
        // SEARCH LOGIC (GIỮ NGUYÊN)
        // ==========================================
        const searchOverlay = document.getElementById('search-overlay');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const searchBoxContainer = document.getElementById('search-box-container');
        const searchResultsArea = document.getElementById('search-results-area');

        function openSearch() {
            searchOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            requestAnimationFrame(() => {
                searchOverlay.classList.remove('opacity-0');
                searchBoxContainer.classList.remove('translate-y-[-20px]');
                searchInput.focus();
            });
        }

        function closeSearch() {
            searchOverlay.classList.add('opacity-0');
            searchBoxContainer.classList.add('translate-y-[-20px]');
            setTimeout(() => {
                searchOverlay.classList.add('hidden');
                document.body.style.overflow = '';
                searchInput.value = '';
                searchResults.innerHTML = '';
                searchResultsArea.classList.add('opacity-0');
            }, 300);
        }

        document.getElementById('open-search-btn').onclick = openSearch;
        document.getElementById('close-search-btn').onclick = closeSearch;
        
        searchOverlay.onclick = (e) => {
            if(e.target === searchOverlay) closeSearch();
        }
        
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            searchResults.innerHTML = '';
            
            if(query.length > 0) {
                searchResultsArea.classList.remove('opacity-0');
                const filtered = books.filter(b => b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query));

                if(filtered.length === 0) {
                    searchResults.innerHTML = `<div class="col-span-full text-center text-white/70 py-4">Không tìm thấy sách nào</div>`;
                } else {
                    filtered.forEach(book => {
                        const el = document.createElement('div');
                        el.className = 'bg-white/80 backdrop-blur hover:bg-white p-3 rounded-xl flex gap-4 cursor-pointer transition-colors shadow-sm border border-white/40 group';
                        el.onclick = () => {
                            closeSearch();
                            setTimeout(() => openModal(book), 300);
                        };
                        el.innerHTML = `
                            <img src="${book.cover}" class="w-12 h-16 rounded object-cover shadow-sm">
                            <div class="flex flex-col justify-center">
                                <h4 class="font-bold text-slate-800 text-sm mb-1">${book.title}</h4>
                                <p class="text-xs text-slate-500">${book.author}</p>
                            </div>
                        `;
                        searchResults.appendChild(el);
                    });
                }
            } else {
                searchResultsArea.classList.add('opacity-0');
            }
        });
    </script>
</body>
</html>
