<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading - Thư viện Dạy Con Làm Giàu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar for PDF Reader */
        iframe::-webkit-scrollbar {
            width: 8px;
        }
        iframe::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        iframe::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 transition-colors duration-300 min-h-screen">

    <!-- App Container -->
    <div id="app">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-20 backdrop-blur-md border-b bg-white/90 border-gray-200 dark:bg-gray-900/90 dark:border-gray-700 transition-colors duration-300">
            <div class="container mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-2 cursor-pointer" onclick="goHome()">
                    <i data-lucide="book" class="text-yellow-500 w-7 h-7"></i>
                    <h1 class="text-xl font-bold tracking-tight hidden sm:block dark:text-white">Rich Dad <span class="text-yellow-500">Reader</span></h1>
                </div>

                <!-- Search Bar -->
                <div class="flex-1 max-w-md mx-4">
                    <div class="relative group">
                        <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                        <input
                            type="text"
                            id="search-input"
                            oninput="handleSearch()"
                            placeholder="Tìm kiếm sách..."
                            class="w-full pl-10 pr-4 py-2 rounded-full border outline-none transition-all bg-gray-50 border-gray-200 focus:border-yellow-500 focus:bg-white dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:focus:border-yellow-500"
                        />
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="toggleTheme()" class="p-2 rounded-full transition-colors hover:bg-gray-200 text-gray-600 dark:text-yellow-400 dark:hover:bg-gray-800">
                        <i id="theme-icon" data-lucide="moon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- LIBRARY VIEW -->
        <main id="library-view" class="container mx-auto px-4 py-8">
            <div class="mb-8">
                <h2 class="text-2xl font-bold mb-2 dark:text-white">Thư viện Dạy Con Làm Giàu</h2>
                <p class="text-sm text-gray-600 dark:text-gray-400">
                    Trọn bộ 13 tập kinh điển của Robert Kiyosaki
                </p>
            </div>

            <div id="book-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Books will be injected here via JS -->
            </div>
            
            <div id="no-results" class="hidden text-center py-20 opacity-50 dark:text-white">
                <p>Không tìm thấy cuốn sách nào phù hợp.</p>
            </div>
        </main>

        <!-- READER VIEW (Hidden by default) -->
        <div id="reader-view" class="hidden flex flex-col h-[calc(100vh-64px)] bg-gray-50 dark:bg-gray-900">
            <!-- Reader Toolbar -->
            <div class="h-14 border-b flex items-center justify-between px-4 shadow-sm bg-white border-gray-200 dark:bg-gray-800 dark:border-gray-700">
                <button onclick="goHome()" class="flex items-center space-x-2 hover:opacity-70 dark:text-white">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    <span class="hidden sm:inline font-medium">Thư viện</span>
                </button>
                
                <div class="flex-1 text-center px-4">
                    <h2 id="reader-title" class="text-sm sm:text-base font-bold truncate max-w-xs sm:max-w-md mx-auto dark:text-white">
                        Đang đọc sách...
                    </h2>
                </div>

                <div class="flex items-center space-x-3">
                     <!-- Nút tải xuống nếu trình duyệt không hỗ trợ xem -->
                     <a id="download-btn" href="#" download class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-white" title="Tải PDF">
                        <i data-lucide="download" class="w-5 h-5"></i>
                     </a>
                </div>
            </div>

            <!-- PDF Iframe Container -->
            <div class="flex-1 relative w-full h-full bg-gray-200 dark:bg-gray-900">
                <iframe 
                    id="pdf-frame" 
                    src="" 
                    class="w-full h-full border-0"
                    type="application/pdf">
                </iframe>
                
                <!-- Fallback message -->
                <div id="pdf-error" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center p-4">
                    <p class="mb-4 text-gray-600 dark:text-gray-400">Trình duyệt của bạn không hỗ trợ xem PDF trực tiếp hoặc file không tồn tại.</p>
                    <a id="fallback-link" href="#" class="px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600 transition">
                        Tải sách về máy
                    </a>
                </div>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        // --- 1. DỮ LIỆU SÁCH ---
        // Quan trọng: Tên file 'pdf_file' phải trùng với tên file bạn upload lên GitHub
        const books = [
            { id: 1, vol: "Tập 1", title: "Để không có tiền vẫn tạo ra tiền", subtitle: "Rich Dad Poor Dad", color: "from-yellow-400 to-orange-500", pdf_file: "tap1.pdf", summary: "Cuốn sách khởi đầu, so sánh tư duy giữa người cha nghèo và người cha giàu." },
            { id: 2, vol: "Tập 2", title: "Sử dụng đồng vốn", subtitle: "Cashflow Quadrant", color: "from-blue-400 to-indigo-500", pdf_file: "tap2.pdf", summary: "Giải thích về Kim tứ đồ và cách chuyển sang nhóm C và Đ." },
            { id: 3, vol: "Tập 3", title: "Hướng dẫn đầu tư", subtitle: "Guide to Investing", color: "from-green-400 to-emerald-600", pdf_file: "tap3.pdf", summary: "Hướng dẫn chi tiết về các cấp bậc đầu tư." },
            { id: 4, vol: "Tập 4", title: "Con giàu con thông minh", subtitle: "Rich Kid Smart Kid", color: "from-pink-400 to-rose-500", pdf_file: "tap4.pdf", summary: "Khai phá tiềm năng tài chính cho con cái." },
            { id: 5, vol: "Tập 5", title: "Để có sức mạnh về tài chính", subtitle: "Retire Young Retire Rich", color: "from-purple-400 to-violet-600", pdf_file: "tap5.pdf", summary: "Cách sử dụng đòn bẩy tài chính để nghỉ hưu sớm." },
            { id: 6, vol: "Tập 6", title: "Những câu chuyện thành công", subtitle: "Prophecy", color: "from-red-400 to-red-600", pdf_file: "tap6.pdf", summary: "Tuyển tập những câu chuyện thực tế." },
            { id: 7, vol: "Tập 7", title: "Ai đã lấy tiền của tôi?", subtitle: "Who Took My Money?", color: "from-teal-400 to-teal-600", pdf_file: "tap7.pdf", summary: "Đầu tư kiếm lợi nhuận cao và bảo vệ tài sản." },
            { id: 8, vol: "Tập 8", title: "Để có tích sự đến tiền của tôi", subtitle: "Making Money Work", color: "from-cyan-400 to-blue-500", pdf_file: "tap8.pdf", summary: "Hiểu rõ về dòng tiền." },
            { id: 9, vol: "Tập 9", title: "Những bí mật về tiền bạc", subtitle: "Financial Secrets", color: "from-amber-400 to-yellow-600", pdf_file: "tap9.pdf", summary: "Những điều không bao giờ được học ở nhà trường." },
            { id: 10, vol: "Tập 10", title: "Trước khi bạn thôi việc", subtitle: "Before You Quit Your Job", color: "from-lime-400 to-green-600", pdf_file: "tap10.pdf", summary: "Bài học cho người muốn khởi nghiệp." },
            { id: 11, vol: "Tập 11", title: "Trường dạy kinh doanh", subtitle: "Business School", color: "from-indigo-400 to-purple-500", pdf_file: "tap11.pdf", summary: "Giá trị của kinh doanh theo mạng." },
            { id: 12, vol: "Tập 12", title: "Xây dựng con thuyền tài chính", subtitle: "Building Your Ark", color: "from-sky-400 to-blue-600", pdf_file: "tap12.pdf", summary: "Bảo vệ tương lai tài chính trước biến động." },
            { id: 13, vol: "Tập 13", title: "Nâng cao chỉ số IQ tài chính", subtitle: "Increase Your Financial IQ", color: "from-fuchsia-400 to-pink-600", pdf_file: "tap13.pdf", summary: "5 chỉ số IQ tài chính cốt lõi." },
        ];

        // --- 2. STATE & VARIABLES ---
        let isDarkMode = localStorage.getItem('theme') === 'dark';
        
        // --- 3. DOM ELEMENTS ---
        const libraryView = document.getElementById('library-view');
        const readerView = document.getElementById('reader-view');
        const bookGrid = document.getElementById('book-grid');
        const pdfFrame = document.getElementById('pdf-frame');
        const readerTitle = document.getElementById('reader-title');
        const searchInput = document.getElementById('search-input');
        const noResults = document.getElementById('no-results');
        const themeIcon = document.getElementById('theme-icon');
        const downloadBtn = document.getElementById('download-btn');
        const fallbackLink = document.getElementById('fallback-link');

        // --- 4. FUNCTIONS ---

        // Khởi tạo
        function init() {
            renderBooks(books);
            updateThemeUI();
            lucide.createIcons();
        }

        // Render danh sách sách
        function renderBooks(list) {
            bookGrid.innerHTML = '';
            if (list.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                list.forEach(book => {
                    const card = document.createElement('div');
                    card.className = `group relative cursor-pointer rounded-xl overflow-hidden shadow-lg transition-all duration-300 hover:shadow-2xl transform hover:-translate-y-1 bg-white dark:bg-gray-800`;
                    card.onclick = () => openBook(book);

                    card.innerHTML = `
                        <div class="h-32 w-full bg-gradient-to-r ${book.color} flex items-center justify-center">
                            <span class="text-4xl font-bold text-white opacity-30 select-none">${book.id}</span>
                        </div>
                        <div class="p-5">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold px-2 py-1 rounded-full bg-blue-100 text-blue-800 dark:bg-gray-700 dark:text-blue-300">
                                    ${book.vol}
                                </span>
                            </div>
                            <h3 class="font-bold text-lg mb-1 leading-tight text-gray-900 dark:text-white">
                                ${book.title}
                            </h3>
                            <p class="text-sm mb-3 text-gray-500 dark:text-gray-400">
                                ${book.subtitle}
                            </p>
                            <p class="text-sm line-clamp-2 text-gray-600 dark:text-gray-300">
                                ${book.summary}
                            </p>
                        </div>
                        <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition-all duration-300 flex items-center justify-center opacity-0 group-hover:opacity-100">
                            <span class="bg-white text-black px-4 py-2 rounded-full font-bold shadow-lg transform scale-90 group-hover:scale-100 transition-transform">
                                Đọc ngay
                            </span>
                        </div>
                    `;
                    bookGrid.appendChild(card);
                });
            }
        }

        // Mở sách (Chuyển sang Reader View)
        function openBook(book) {
            // Cập nhật nội dung
            readerTitle.textContent = `${book.vol}: ${book.title}`;
            
            // Set file PDF
            // Lưu ý: Đường dẫn tương đối, giả định file nằm cùng thư mục
            const pdfUrl = book.pdf_file; 
            pdfFrame.src = pdfUrl;
            
            // Update download links
            downloadBtn.href = pdfUrl;
            fallbackLink.href = pdfUrl;

            // Chuyển view
            libraryView.classList.add('hidden');
            readerView.classList.remove('hidden');
            
            // Cuộn lên đầu
            window.scrollTo(0, 0);
        }

        // Quay về trang chủ
        function goHome() {
            readerView.classList.add('hidden');
            libraryView.classList.remove('hidden');
            pdfFrame.src = ""; // Clear src để dừng load/âm thanh nếu có
        }

        // Tìm kiếm
        function handleSearch() {
            const query = searchInput.value.toLowerCase();
            const filtered = books.filter(book => 
                book.title.toLowerCase().includes(query) || 
                book.vol.toLowerCase().includes(query) ||
                book.subtitle.toLowerCase().includes(query)
            );
            renderBooks(filtered);
        }

        // Dark Mode Logic
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
            updateThemeUI();
        }

        function updateThemeUI() {
            const html = document.documentElement;
            if (isDarkMode) {
                html.classList.add('dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                html.classList.remove('dark');
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons(); // Refresh icons
        }

        // Error handling for Iframe (cơ bản)
        pdfFrame.onerror = function() {
            document.getElementById('pdf-error').classList.remove('hidden');
        };

        // Chạy khởi tạo khi load trang
        init();

    </script>
</body>
</html>
