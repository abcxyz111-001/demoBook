<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thư Viện Sách Hiện Đại</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f0f2f5;
            color: #1e293b;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- BACKGROUND ANIMATION (MESH GRADIENT) --- */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                        radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                        radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-color: #f3f4f6;
            background-image: 
                radial-gradient(at 80% 0%, hsla(189,100%,90%,1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(341,100%,92%,1) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(263,100%,93%,1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22,100%,92%,1) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(240,100%,94%,1) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343,100%,94%,1) 0px, transparent 50%);
            filter: blur(40px);
            opacity: 0.8;
            animation: bg-pulse 15s ease-in-out infinite alternate;
        }

        @keyframes bg-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* --- GLASSMORPHISM CARD --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* --- 3D TILT EFFECT & HOVER --- */
        .book-card-container {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            perspective: 1000px;
        }
        
        @media (hover: hover) {
            .book-card-container:hover {
                transform: translateY(-5px);
            }
            .book-card-inner {
                transition: transform 0.1s ease-out;
            }
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-entry {
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        /* --- SCROLLBAR --- */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Background động -->
    <div class="bg-mesh"></div>

    <!-- HEADER -->
    <header class="sticky top-0 z-40 glass-panel border-b-0 shadow-sm supports-[backdrop-filter]:bg-white/60">
        <div class="max-w-7xl mx-auto px-5 sm:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-3 cursor-pointer select-none">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                        <i data-lucide="library" class="w-5 h-5"></i>
                    </div>
                    <span class="font-bold text-xl tracking-tight text-slate-800">MyLibrary.</span>
                </div>
                <!-- Search Button có ID để JS bắt sự kiện -->
                <button id="open-search-btn" class="w-10 h-10 rounded-full bg-white/50 hover:bg-white flex items-center justify-center text-slate-600 transition shadow-sm border border-white/60 active:scale-95">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-5 sm:px-8 py-8 w-full pb-20">
        
        <!-- SECTION 1: SÁCH YÊU THÍCH (Spotlight) -->
        <section class="mb-12 animate-entry" style="animation-delay: 0.1s;">
            <div class="flex items-center gap-2 mb-6">
                <i data-lucide="sparkles" class="text-amber-500 w-5 h-5 fill-amber-500"></i>
                <h2 class="text-2xl font-bold text-slate-800">Sách Yêu Thích</h2>
            </div>
            
            <div id="favorites-container" class="flex gap-6 overflow-x-auto hide-scroll pb-8 snap-x snap-mandatory">
                <!-- JS sẽ render sách yêu thích vào đây -->
            </div>
        </section>

        <!-- SECTION 2: TẤT CẢ SÁCH (Library Grid) -->
        <section class="animate-entry" style="animation-delay: 0.3s;">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Tủ Sách</h2>
                <span class="text-sm font-medium text-slate-500 bg-white/50 px-3 py-1 rounded-full border border-white/60" id="total-books">0 cuốn</span>
            </div>

            <div id="book-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                <!-- JS Render sách thường -->
            </div>
        </section>

    </main>

    <!-- SEARCH OVERLAY (Màn hình tìm kiếm) -->
    <div id="search-overlay" class="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-md hidden transition-opacity opacity-0 duration-300">
        <div class="max-w-3xl mx-auto pt-20 px-6 w-full">
            <div class="relative transform transition-all duration-300 translate-y-[-20px]" id="search-box-container">
                <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 w-6 h-6"></i>
                <input id="search-input" type="text" placeholder="Tìm tên sách, tác giả..." autocomplete="off"
                    class="w-full bg-white/90 backdrop-blur-xl border-0 rounded-2xl py-4 pl-14 pr-14 text-lg shadow-2xl focus:ring-4 focus:ring-indigo-500/30 outline-none placeholder:text-slate-400 text-slate-800">
                <button id="close-search-btn" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 hover:bg-slate-200/50 rounded-full transition text-slate-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div id="search-results-area" class="mt-6 opacity-0 transition-opacity duration-500">
                <p id="search-status" class="text-white/70 text-sm font-medium mb-4 ml-1 hidden">Kết quả tìm kiếm:</p>
                <div id="search-results" class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[60vh] overflow-y-auto pr-2 custom-scroll">
                    <!-- Kết quả tìm kiếm sẽ hiện ở đây -->
                </div>
                <div id="no-results" class="hidden text-center mt-10">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/10 mb-4 backdrop-blur-sm">
                        <i data-lucide="search-x" class="w-8 h-8 text-white/60"></i>
                    </div>
                    <p class="text-lg text-white/90 font-medium">Không tìm thấy sách nào</p>
                    <p class="text-white/50 text-sm mt-1">Hãy thử tìm từ khóa khác xem sao</p>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL (POPUP CHI TIẾT SÁCH) -->
    <div id="book-modal" class="relative z-[100] hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-md transition-opacity opacity-0" id="modal-backdrop"></div>

        <!-- Wrapper -->
        <div id="modal-wrapper" class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
                
                <!-- Panel Glassmorphism -->
                <div class="relative transform overflow-hidden rounded-3xl bg-white/90 backdrop-blur-2xl text-left shadow-2xl transition-all sm:my-8 w-full max-w-lg opacity-0 scale-95 border border-white/50" id="modal-panel">
                    
                    <!-- Cover Header -->
                    <div class="relative h-48 bg-gradient-to-br from-indigo-100 to-purple-100 flex items-center justify-center">
                         <!-- Background mờ của ảnh bìa -->
                        <img id="modal-bg-blur" src="" class="absolute inset-0 w-full h-full object-cover opacity-30 blur-xl">
                        
                        <!-- Ảnh bìa chính -->
                        <div class="relative z-10 shadow-2xl rounded-lg rotate-3 transform translate-y-8 transition-transform hover:rotate-0 duration-500">
                             <img id="modal-img" src="" class="w-28 sm:w-32 rounded-lg object-cover border-2 border-white/30">
                        </div>
                        
                        <!-- Close Button -->
                        <button onclick="closeModal()" class="absolute top-4 right-4 p-2 bg-black/10 hover:bg-black/20 rounded-full text-slate-700 transition backdrop-blur-sm">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <!-- Content -->
                    <div class="px-6 pt-12 pb-6">
                        <div class="text-center mb-6">
                            <h3 class="text-2xl font-bold text-slate-900 leading-tight mb-1" id="modal-title">Book Title</h3>
                            <p class="text-indigo-600 font-medium" id="modal-author">Author</p>
                            <div class="flex justify-center gap-2 mt-3">
                                <span id="modal-category" class="px-2 py-1 rounded-md bg-slate-100 text-slate-500 text-xs font-bold uppercase tracking-wider">Cat</span>
                            </div>
                        </div>

                        <p class="text-slate-600 text-sm leading-relaxed text-center mb-8 px-2" id="modal-desc">
                            Description...
                        </p>

                        <!-- Action Buttons -->
                        <div class="flex gap-3">
                            <a id="modal-link-btn" href="#" target="_blank" class="flex-1 btn-read bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-slate-900/20 transition-all flex items-center justify-center gap-2 group">
                                <span>Đọc Ngay</span>
                                <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        lucide.createIcons();

        // ==========================================
        // DỮ LIỆU SÁCH
        // ==========================================
        const books = [
            {
                id: 1,
                title: "Nhà Giả Kim",
                author: "Paulo Coelho",
                category: "Tiểu thuyết",
                desc: "Hành trình theo đuổi vận mệnh của chàng chăn cừu Santiago. Một câu chuyện kinh điển thúc đẩy mọi người theo đuổi ước mơ.",
                cover: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400",
                isFavorite: true,
                link: "dayconlamgiau.html"
            },
            {
                id: 2,
                title: "Đắc Nhân Tâm",
                author: "Dale Carnegie",
                category: "Kỹ năng sống",
                desc: "Nghệ thuật thu phục lòng người. Quy tắc ứng xử để thành công trong giao tiếp và cuộc sống.",
                cover: "https://images.unsplash.com/photo-1589829085413-56de8ae18c73?auto=format&fit=crop&q=80&w=400",
                isFavorite: true,
                link: "https://google.com" 
            },
            {
                id: 3,
                title: "Clean Code",
                author: "Robert C. Martin",
                category: "Lập trình",
                desc: "Hướng dẫn viết mã sạch. Cuốn sách gối đầu giường cho mọi lập trình viên chuyên nghiệp.",
                cover: "https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&q=80&w=400",
                isFavorite: false,
                link: "#"
            },
            {
                id: 4,
                title: "Sapiens: Lược Sử",
                author: "Yuval Noah Harari",
                category: "Lịch sử",
                desc: "Lược sử loài người từ thời kỳ đồ đá đến kỷ nguyên công nghệ sinh học và trí tuệ nhân tạo.",
                cover: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=400",
                isFavorite: false,
                link: "#"
            },
            {
                id: 5,
                title: "Tuổi Trẻ Đáng Giá Bao Nhiêu",
                author: "Rosie Nguyễn",
                category: "Self-help",
                desc: "Cuốn sách dành cho người trẻ đang loay hoay tìm hướng đi, khuyến khích tự học và trải nghiệm.",
                cover: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=400",
                isFavorite: true,
                link: "#"
            },
             {
                id: 6,
                title: "Harry Potter",
                author: "J.K. Rowling",
                category: "Giả tưởng",
                desc: "Cậu bé phù thủy và chuyến phiêu lưu tại trường Hogwarts chống lại chúa tể hắc ám.",
                cover: "https://images.unsplash.com/photo-1618666012174-83b441c0bc76?auto=format&fit=crop&q=80&w=400",
                isFavorite: false,
                link: "#"
            },
            {
                id: 7,
                title: "Tư Duy Nhanh & Chậm",
                author: "Daniel Kahneman",
                category: "Tâm lý học",
                desc: "Phân tích hai hệ thống tư duy chi phối nhận thức và cách chúng ta đưa ra quyết định.",
                cover: "https://images.unsplash.com/photo-1555449373-4f952c427670?auto=format&fit=crop&q=80&w=400",
                isFavorite: false,
                link: "#"
            }
        ];

        // ==========================================
        // RENDER LOGIC
        // ==========================================

        document.getElementById('total-books').textContent = `${books.length} cuốn`;

        // 1. Render Sách Yêu Thích
        const favContainer = document.getElementById('favorites-container');
        const favBooks = books.filter(b => b.isFavorite);

        if(favBooks.length === 0) favContainer.parentElement.style.display = 'none';

        favBooks.forEach((book) => {
            const card = document.createElement('div');
            card.className = "snap-center shrink-0 w-[280px] sm:w-[320px] glass-panel rounded-3xl p-5 cursor-pointer transition-transform hover:scale-[1.02] active:scale-95";
            card.onclick = () => openModal(book);

            card.innerHTML = `
                <div class="flex gap-5 items-center">
                    <div class="w-24 h-36 rounded-xl overflow-hidden shadow-lg shrink-0">
                        <img src="${book.cover}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] font-bold text-amber-500 uppercase tracking-widest mb-1">Top Pick</span>
                        <h3 class="font-bold text-slate-800 text-lg leading-tight mb-1 line-clamp-2">${book.title}</h3>
                        <p class="text-slate-500 text-sm mb-2">${book.author}</p>
                        <button class="bg-slate-900 text-white text-xs font-bold py-2 px-3 rounded-lg w-fit mt-auto shadow-md">
                            Đọc ngay
                        </button>
                    </div>
                </div>
            `;
            favContainer.appendChild(card);
        });

        // 2. Render Grid Sách
        const gridElement = document.getElementById('book-grid');

        function renderBookCard(book, container, delayIndex = 0) {
             const card = document.createElement('div');
            card.className = "book-card-container group cursor-pointer animate-entry flex flex-col";
            card.style.animationDelay = `${delayIndex * 0.05}s`;
            card.onclick = () => openModal(book);

            // Tilt Effect logic (Desktop only)
            card.onmousemove = (e) => {
                if(window.innerWidth < 768) return;
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -10; 
                const rotateY = ((x - centerX) / centerX) * 10;

                const inner = card.querySelector('.book-card-inner');
                if(inner) inner.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            };

            card.onmouseleave = () => {
                const inner = card.querySelector('.book-card-inner');
                if(inner) inner.style.transform = `perspective(1000px) rotateX(0) rotateY(0)`;
            };

            card.innerHTML = `
                <div class="book-card-inner relative w-full aspect-[2/3] mb-4 rounded-2xl transition-all duration-200 ease-out">
                    <div class="w-full h-full rounded-2xl overflow-hidden bg-white shadow-md relative z-10 border border-white/60">
                        <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors duration-300 flex items-center justify-center">
                             <div class="bg-white/90 backdrop-blur-sm p-2 rounded-full opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-300 shadow-lg">
                                <i data-lucide="arrow-up-right" class="w-5 h-5 text-slate-900"></i>
                            </div>
                        </div>
                    </div>
                    <div class="absolute -bottom-2 inset-x-4 h-4 bg-slate-900/10 blur-md rounded-full z-0 group-hover:bg-slate-900/20 transition-colors"></div>
                </div>
                
                <div class="px-1 text-center sm:text-left">
                    <h3 class="font-bold text-slate-800 text-sm sm:text-base leading-tight mb-1 group-hover:text-indigo-600 transition-colors line-clamp-1">${book.title}</h3>
                    <p class="text-slate-500 text-xs sm:text-sm font-medium line-clamp-1">${book.author}</p>
                </div>
            `;
            container.appendChild(card);
        }

        // Render toàn bộ sách ra lưới
        books.forEach((book, index) => renderBookCard(book, gridElement, index));
        
        lucide.createIcons();

        // ==========================================
        // MODAL LOGIC (POPUP CHI TIẾT)
        // ==========================================
        const modal = document.getElementById('book-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalPanel = document.getElementById('modal-panel');
        const modalWrapper = document.getElementById('modal-wrapper');

        // Modal Elements
        const mImg = document.getElementById('modal-img');
        const mBgBlur = document.getElementById('modal-bg-blur');
        const mTitle = document.getElementById('modal-title');
        const mAuthor = document.getElementById('modal-author');
        const mDesc = document.getElementById('modal-desc');
        const mCat = document.getElementById('modal-category');
        const mLinkBtn = document.getElementById('modal-link-btn');

        function openModal(book) {
            document.body.style.overflow = 'hidden';

            mImg.src = book.cover;
            mBgBlur.src = book.cover;
            mTitle.textContent = book.title;
            mAuthor.textContent = book.author;
            mDesc.textContent = book.desc;
            mCat.textContent = book.category;
            
            // Link Logic
            if (book.link && book.link !== "#") {
                mLinkBtn.href = book.link;
                mLinkBtn.classList.remove('opacity-50', 'pointer-events-none');
                mLinkBtn.innerHTML = `<span>Đọc Ngay</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                lucide.createIcons(); // Re-render icon
            } else {
                mLinkBtn.href = "javascript:void(0)";
                mLinkBtn.classList.add('opacity-50', 'pointer-events-none');
                mLinkBtn.innerHTML = `<span>Chưa có link</span>`;
            }

            modal.classList.remove('hidden');
            
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    modalBackdrop.classList.remove('opacity-0');
                    modalPanel.classList.remove('opacity-0', 'scale-95');
                    modalPanel.classList.add('opacity-100', 'scale-100');
                });
            });
        }

        function closeModal() {
            modalBackdrop.classList.add('opacity-0');
            modalPanel.classList.remove('opacity-100', 'scale-100');
            modalPanel.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        modalWrapper.addEventListener('click', (e) => {
            if (e.target === modalWrapper || e.target.classList.contains('min-h-full')) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
        });

        // ==========================================
        // SEARCH LOGIC (CHỨC NĂNG TÌM KIẾM MỚI)
        // ==========================================
        const openSearchBtn = document.getElementById('open-search-btn');
        const closeSearchBtn = document.getElementById('close-search-btn');
        const searchOverlay = document.getElementById('search-overlay');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const searchStatus = document.getElementById('search-status');
        const noResults = document.getElementById('no-results');
        const searchBoxContainer = document.getElementById('search-box-container');
        const searchResultsArea = document.getElementById('search-results-area');

        function openSearch() {
            searchOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            // Animation sequence
            requestAnimationFrame(() => {
                searchOverlay.classList.remove('opacity-0');
                searchBoxContainer.classList.remove('translate-y-[-20px]');
                searchInput.focus();
            });
        }

        function closeSearch() {
            searchOverlay.classList.add('opacity-0');
            searchBoxContainer.classList.add('translate-y-[-20px]');
            
            setTimeout(() => {
                searchOverlay.classList.add('hidden');
                document.body.style.overflow = '';
                // Reset search
                searchInput.value = '';
                searchResults.innerHTML = '';
                searchStatus.classList.add('hidden');
                noResults.classList.add('hidden');
                searchResultsArea.classList.add('opacity-0');
            }, 300);
        }

        openSearchBtn.onclick = openSearch;
        closeSearchBtn.onclick = closeSearch;
        
        // Đóng khi click ra ngoài ô input
        searchOverlay.onclick = (e) => {
            if(e.target === searchOverlay || e.target.closest('#search-results-area') === null && e.target !== searchInput && e.target.closest('#search-box-container') === null) {
                // Chỉ đóng nếu click vào vùng nền trống, tránh đóng nhầm khi click vào kết quả
                if (e.target === searchOverlay) closeSearch();
            }
        }
        
        // Xử lý Input
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            searchResults.innerHTML = '';
            
            if(query.length > 0) {
                searchResultsArea.classList.remove('opacity-0');
                searchStatus.classList.remove('hidden');
                
                const filtered = books.filter(b => 
                    b.title.toLowerCase().includes(query) || 
                    b.author.toLowerCase().includes(query)
                );

                if(filtered.length === 0) {
                    noResults.classList.remove('hidden');
                } else {
                    noResults.classList.add('hidden');
                    filtered.forEach(book => {
                        // Tạo card kết quả tìm kiếm (Mini card)
                        const el = document.createElement('div');
                        el.className = 'bg-white/80 backdrop-blur hover:bg-white p-3 rounded-xl flex gap-4 cursor-pointer transition-colors shadow-sm border border-white/40 group';
                        el.onclick = () => {
                            // Đóng tìm kiếm trước khi mở modal sách
                            // Giữ lại overlay một chút để transition mượt hơn
                            searchOverlay.classList.add('opacity-0');
                            setTimeout(() => {
                                searchOverlay.classList.add('hidden');
                                // Reset search state
                                searchInput.value = '';
                                searchResults.innerHTML = '';
                                document.body.style.overflow = ''; 
                                openModal(book);
                            }, 200);
                        };
                        el.innerHTML = `
                            <div class="w-16 h-20 shrink-0 rounded-lg overflow-hidden shadow-sm">
                                <img src="${book.cover}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                            </div>
                            <div class="flex flex-col justify-center">
                                <h4 class="font-bold text-slate-800 text-base leading-tight mb-1">${book.title}</h4>
                                <p class="text-sm text-slate-500">${book.author}</p>
                                <span class="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded mt-2 w-fit uppercase tracking-wider font-bold">${book.category}</span>
                            </div>
                        `;
                        searchResults.appendChild(el);
                    });
                }
            } else {
                searchResultsArea.classList.add('opacity-0');
                setTimeout(() => {
                    searchStatus.classList.add('hidden');
                    noResults.classList.add('hidden');
                }, 200);
            }
        });

        // Phím tắt ESC cho search
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !searchOverlay.classList.contains('hidden')) {
                closeSearch();
            }
        });

    </script>
</body>
</html>
